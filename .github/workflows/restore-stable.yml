name: Restore previous stable version
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Restore the version before the new QA, settings and reduction tools?'
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: release-writes
  cancel-in-progress: false
jobs:
  restore:
    if: inputs.confirm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Prepare the stable tree without rewriting history
        run: git restore --source=d21705e560ab9af418ece5122c021d9028ed4006 --staged --worktree -- . ':(exclude).github/workflows/**' ':(exclude)scripts/update_shabbat_schedule.py' ':(exclude)data/shabbat_jerusalem.json' ':(exclude)tests/test_shabbat_schedule.py' ':(exclude)tests/test_rollback.py' ':(exclude)ROLLBACK_HE.md'
      - run: npm ci
      - run: npm test
      - name: Publish the restore as a new commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Restore stable version d21705e5 before QA and settings improvements"
            git push origin HEAD:main
          fi
